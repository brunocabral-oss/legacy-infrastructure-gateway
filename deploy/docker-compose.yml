version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lig_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mock_db_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lig_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lig_admin} -d ${POSTGRES_DB:-lig_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: lig-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      LIG_ENVIRONMENT: development
      LIG_LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lig_admin}:${POSTGRES_PASSWORD:-mock_db_password_change_me}@postgres:5432/${POSTGRES_DB:-lig_db}
      LIG_ENABLE_MOCK_DRIVER: "true"
      LIG_READ_ONLY_MODE: "true"
      LIG_RAW_COMMANDS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
